name: Build MAXPay APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create build com.maxpay.app MAXPay
          rm -rf build/www
          mkdir -p build/www
          cp -r index.html admin.html css js config.xml build/www/

      - name: Add Android Platform
        working-directory: build
        run: cordova platform add android

      - name: Build APK
        working-directory: build
        run: cordova build android --release

      - name: List APK files (debug)
        run: |
          echo "=== Searching for APKs ==="
          find build -name "*.apk" -type f

      - name: Copy APK to output
        run: |
          mkdir -p output
          APK=$(find build -name "*.apk" -type f | head -1)
          echo "Found APK: $APK"
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          cp "$APK" output/MAXPay.apk
          ls -la output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAXPay-APK
          path: output/MAXPay.apk
